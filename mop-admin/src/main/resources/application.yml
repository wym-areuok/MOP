# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ./uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.mop: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥（256位随机密钥，生产环境请通过环境变量注入）
  secret: MOP-2026-Secure-Token-Key-7xK9mP2qR5vW8yZ1aB3cD4eF6gH9jL0n
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.mop.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml
  configuration:
    jdbc-type-for-null: 'NULL'

# PageHelper分页插件
pagehelper:
  helperDialect: sqlserver
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.mop.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

#  AI 模型配置 —— 添加到 ruoyi 的 application.yml
#  切换模型只需修改 provider + 对应的 api-key / model-name
ai:
  model:
    # ── 当前启用的提供商 ────────────────────────────────────────
    # 说明：
    # - 这里仍然使用 openai，因为火山引擎 Ark 兼容 OpenAI API 协议
    # - 如果你后面想区分，也可以自定义成 ark
    # 可选值: dashscope | openai | deepseek | ollama | ark(自定义)
    provider: openai
    # ── API Key（必填）──────────────────────────────────────────
    # 火山引擎控制台申请的 API Key（以 ark- 开头）
    # 注意：必须配合 Authorization: Bearer 使用
    api-key: ark-9c957d7a-c6d9-4e4a-a396-3817355d4dda-a3b58
    # ── 模型名称（⚠️最关键）─────────────────────────────────────
    # 不是模型名（如 GLM-5.2），而是“推理接入点 ID”
    # 格式：ep-xxxxxxxxxxxx
    # 在火山引擎 → 在线推理 → 接入点列表中获取
    model-name: ep-20260703164026-ncjmt
    # ── API 地址（必须修改）─────────────────────────────────────
    # 火山引擎 Ark 专用地址（不是 OpenAI 官方地址）
    # 不要用：https://api.openai.com/v1
    # 不要用：https://api.siliconflow.cn/v1
    # 正确：
    base-url: https://ark.cn-beijing.volces.com/api/v3
    # ── 通用参数 ────────────────────────────────────────────────
    # 最大生成 token 数 512-2048
    max-tokens: 1024
    # 随机性（越高越发散，越低越稳定）
    temperature: 0.7
    # 上下文最大消息数量（用于多轮对话）
    max-history-messages: 5
    # ── 系统提示词（支持自定义 AI 角色与行为）───────────────────
    system-prompt: "你的名字是『牛牛哥』。你是由 MES 运维平台开发的专属助手"

# ============================================================
#  切换示例
# ============================================================
#
#  → 切换为 DeepSeek：
#    provider: deepseek
#    api-key: sk-deepseek的key
#    model-name: deepseek-chat
#
#  → 切换为本地 Ollama（完全免费，需先运行 ollama serve）：
#    provider: ollama
#    base-url: http://localhost:11434
#    model-name: qwen2.5
#
#  → 切换为 OpenAI：
#    provider: openai
#    api-key: sk-openai的key
#    model-name: gpt-4o-mini