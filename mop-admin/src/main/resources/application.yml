# ===================================================================
# MOP 公共配置（所有环境共用，开发/生产统一）
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                         配置文件加载顺序与覆盖规则                         ║
# ╠══════════════════════════════════════════════════════════════════════════╣
# ║                                                                          ║
# ║  激活命令: 默认无需指定（application.yml 已设置 druid,dev）              ║
# ║  生产部署: java -jar mop-admin.jar --spring.profiles.active=druid,prod   ║
# ║                                                                          ║
# ║   第 1 层: application.yml          公共配置（服务端口、MyBatis等）       ║
# ║              │   spring.profiles.active: druid,dev  → 自动激活             ║
# ║              ▼                                                           ║
# ║   第 2 层: application-druid.yml     Druid 基准配置（驱动、池参数、过滤器）║
# ║              │   druid profile 始终激活                                    ║
# ║              ▼                                                           ║
# ║   第 3 层: application-dev.yml       开发环境差异化配置（默认）            ║
# ║       或: application-prod.yml      生产环境差异化配置（命令行覆盖）      ║
# ║                                                                          ║
# ║   规则: 同名 key 后者覆盖前者，不同名 key 累加合并                          ║
# ║   示例: druid.yml 定义 maxActive=20, prod.yml 定义 maxActive=50           ║
# ║         → 最终生效 maxActive=50（prod 覆盖）                              ║
# ║   示例: druid.yml 定义 validationQuery=SELECT 1                           ║
# ║         prod.yml 未定义 → 最终生效 validationQuery=SELECT 1（继承基准）    ║
# ║                                                                          ║
# ║  ⚠️ 修改原则:                                                             ║
# ║   - application-druid.yml: 放所有环境都相同的连接池/过滤器配置              ║
# ║   - application-dev.yml:   只写与 druid.yml 不同的配置，重复的直接删掉     ║
# ║   - application-prod.yml:  只写与 druid.yml 不同的配置，重复的直接删掉     ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# 配置文件说明:
#   application.yml        ← 当前文件：服务端口、MyBatis、Jackson等公共配置
#   application-dev.yml    ← 开发环境，激活: --spring.profiles.active=dev
#   application-prod.yml   ← 生产环境，激活: --spring.profiles.active=prod
#   application-druid.yml  ← Druid 数据源基准配置（二层加载，所有环境通用）
#
# 启动方式:
#   开发（IDEA 默认）: mvn spring-boot:run
#   开发（JAR）:       java -jar mop-admin.jar --spring.profiles.active=dev
#   生产:              java -jar mop-admin.jar --spring.profiles.active=prod
# ===================================================================

# 项目相关配置
mop:
  name: MOP
  version: 2.0.0
  copyrightYear: 2026
  # 文件上传路径：开发环境用相对路径，生产环境改为绝对路径 /data/mop/uploadPath
  profile: ./uploadPath
  addressEnabled: false
  captchaType: math

# 服务器基础配置
server:
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000

# Token 公共配置
token:
  header: Authorization
  # 兜底密钥: 仅当未指定 dev/prod profile 时使用，生产环境必须由 prod.yml 覆盖
  secret: default-secret-NOT-FOR-PRODUCTION
  expireTime: 30

# MyBatis 配置（全环境一致）
mybatis:
  typeAliasesPackage: com.mop.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml
  configuration:
    jdbc-type-for-null: 'NULL'

# PageHelper 分页（仅 SQL Server）
pagehelper:
  helperDialect: sqlserver
  supportMethodsArguments: true
  params: count=countSql

# 用户密码策略（全环境一致）
user:
  password:
    maxRetryCount: 5
    lockTime: 10

# AI 角色定义（全环境一致，API Key 在各 profile 中配置）
ai:
  model:
    max-tokens: 1024
    temperature: 0.7
    max-history-messages: 5
    system-prompt: "你的名字是「牛牛哥」。你是由 MES 运维平台开发的专属助手"

# Spring 基础配置
spring:
  # 默认环境: 开发。始终包含 druid（数据库驱动/过滤器公共配置）
  # 生产部署时覆盖: java -jar mop-admin.jar --spring.profiles.active=druid,prod
  profiles:
    active: druid,dev
  messages:
    basename: i18n/messages
    use-code-as-default-message: true
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

# 防盗链公共配置（是否启用由 dev/prod 各自控制）
referer:
  allowed-domains: localhost,127.0.0.1

# Quartz 任务执行超时（分钟，0=不限制，建议生产设为30~60）
quartz:
  jobTimeoutMinutes: 30

# XSS 过滤公共配置
xss:
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*

# Springdoc 公共配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.mop.web.controller.tool
