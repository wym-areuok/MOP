# ===================================================================
# MOP 公共配置（所有环境共用，开发/生产统一）
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                         配置文件加载顺序与覆盖规则                         ║
# ╠══════════════════════════════════════════════════════════════════════════╣
# ║                                                                          ║
# ║  共 3 个配置文件，2 层加载:                                                ║
# ║                                                                          ║
# ║   第 1 层: application.yml          公共配置（框架选型 + 策略 + 路径）    ║
# ║              │   spring.profiles.active: dev  → 默认激活开发环境           ║
# ║              ▼                                                           ║
# ║   第 2 层: application-dev.yml       开发环境完整配置（默认）              ║
# ║       或: application-prod.yml      生产环境完整配置（命令行覆盖）         ║
# ║                                                                          ║
# ║   规则: 同名 key 后者覆盖前者，不同名 key 累加合并                          ║
# ║                                                                          ║
# ║  每个环境文件自包含，打开即完整配置，无需跨文件查找                          ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# 配置文件说明:
#   application.yml        ← 当前文件：框架选型、策略参数、技术栈常量
#   application-dev.yml    ← 开发环境完整配置（明文，开箱即用）
#   application-prod.yml   ← 生产环境完整配置（明文，按需填写）
#
# 启动方式:
#   开发（IDEA 默认）: mvn spring-boot:run
#   开发（JAR）:       java -jar mop-admin.jar --spring.profiles.active=dev
#   生产:              java -jar mop-admin.jar --spring.profiles.active=prod
# ===================================================================

# 项目相关配置
mop:
  name: MOP
  version: 2.0.0
  copyrightYear: 2026
  # 文件上传路径在各环境文件中单独配置
  addressEnabled: false
  captchaType: math

# 服务器基础配置
server:
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8

# Token 公共配置
token:
  header: Authorization
  expireTime: 30

# MyBatis 配置（全环境一致）
mybatis:
  typeAliasesPackage: com.mop.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml
  configuration:
    jdbc-type-for-null: 'NULL'

# PageHelper 分页（仅 SQL Server）
pagehelper:
  helperDialect: sqlserver
  supportMethodsArguments: true
  params: count=countSql

# 用户密码策略（全环境一致）
user:
  password:
    maxRetryCount: 5
    lockTime: 10

# AI 模型公共参数（API Key / 厂商 / 模型名在各 profile 中配置）
ai:
  model:
    max-tokens: 1024
    temperature: 0.7
    max-history-messages: 5
    system-prompt: "你的名字是「牛牛哥」。你是由 MES 运维平台开发的专属助手"

# Spring 基础配置
spring:
  profiles:
    active: dev
  messages:
    basename: i18n/messages
    use-code-as-default-message: true
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # ---------- 数据源基础设施常量（技术选型，所有环境一致） ----------
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
    druid:
      # 从库数据源（所有环境默认关闭）
      slave:
        enabled: false
        url:
        username:
        password:
      # 连接检测（SQL Server 标准做法）
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      # Web 监控
      webStatFilter:
        enabled: true
      # Druid 控制台基础配置（具体 allow / 账号密码由各环境控制）
      statViewServlet:
        enabled: true
        url-pattern: /druid/*
      # SQL 监控
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          db-type: sqlserver

# XSS 过滤规则（全环境一致）
xss:
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*

# Springdoc 公共配置（是否启用由 dev/prod 各自控制 enabled）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.mop.ai
