# ===================================================================
# MOP 开发环境配置（第 2 层加载，自包含完整明文配置）
#
# 加载位置: application.yml → 【application-dev.yml】
#
# 激活方式:
#   IDEA Run/Debug 配置中 Active profiles: dev
#   或命令行: java -jar mop-admin.jar --spring.profiles.active=dev
#   mvn 启动: mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# 说明:
#   1. 连接本地 localhost 的 SQL Server + Redis
#   2. 启用 Spring DevTools 热部署
#   3. 日志级别 debug
#   4. Swagger 接口文档开启（http://localhost:8080/swagger-ui.html）
#   5. Druid 监控面板开启，允许所有 IP 访问
#   6. 防盗链关闭（便于本地前端联调）
#   7. 外部数据源 server_a~e 需填写真实连接信息后才可使用
#
# 注意事项:
#   - 本文件所有配置均为明文，开发环境开箱即用
#   - 生产环境请使用 application-prod.yml
# ===================================================================

# 文件上传路径（开发环境用相对路径）
mop:
  profile: ./uploadPath

server:
  port: 8080
  tomcat:
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.mop: debug
    org.springframework: warn

# ---------- 开发环境 JWT 密钥 ----------
token:
  secret: MOP-2026-Dev-Token-Key-d9kF3pL7sW1xY5zB2aC6dE8fH0jM4nQ

spring:
  devtools:
    restart:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  # ---------- 数据库配置 ----------
  datasource:
    dynamic:
      # Druid 连接池大小（开发环境）
      druid:
        initialSize: 10
        minIdle: 10
        maxActive: 20
      datasource:
        master:
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
          type: com.alibaba.druid.pool.DruidDataSource
          url: jdbc:sqlserver://localhost:1433;DatabaseName=mes_ops_platform;TrustServerCertificate=true;sendStringParametersAsUnicode=true
          username: root
          password: root
        server_a:
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
          type: com.alibaba.druid.pool.DruidDataSource
          url: jdbc:sqlserver://<请填写A服务器IP>:1433;DatabaseName=<请填写入口库名>;TrustServerCertificate=true;sendStringParametersAsUnicode=true
          username: <请填写A服务器账号>
          password: <请填写A服务器密码>
        server_b:
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
          type: com.alibaba.druid.pool.DruidDataSource
          url: jdbc:sqlserver://<请填写B服务器IP>:1433;DatabaseName=<请填写入口库名>;TrustServerCertificate=true;sendStringParametersAsUnicode=true
          username: <请填写B服务器账号>
          password: <请填写B服务器密码>
        server_c:
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
          type: com.alibaba.druid.pool.DruidDataSource
          url: jdbc:sqlserver://<请填写C服务器IP>:1433;DatabaseName=<请填写入口库名>;TrustServerCertificate=true;sendStringParametersAsUnicode=true
          username: <请填写C服务器账号>
          password: <请填写C服务器密码>
        server_d:
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
          type: com.alibaba.druid.pool.DruidDataSource
          url: jdbc:sqlserver://<请填写D服务器IP>:1433;DatabaseName=<请填写入口库名>;TrustServerCertificate=true;sendStringParametersAsUnicode=true
          username: <请填写D服务器账号>
          password: <请填写D服务器密码>
        server_e:
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
          type: com.alibaba.druid.pool.DruidDataSource
          url: jdbc:sqlserver://<请填写E服务器IP>:1433;DatabaseName=<请填写入口库名>;TrustServerCertificate=true;sendStringParametersAsUnicode=true
          username: <请填写E服务器账号>
          password: <请填写E服务器密码>

    # Druid 控制台访问控制
    druid:
      statViewServlet:
        # 不设白名单，允许所有 IP 访问
        allow:
        login-username: admin
        login-password: 123456
      filter:
        wall:
          config:
            multi-statement-allow: true

# ---------- 开发环境 Swagger ----------
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# ---------- 开发环境安全策略 ----------
referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1

xss:
  enabled: true

# ---------- 开发环境 Quartz ----------
quartz:
  jobTimeoutMinutes: 30

# ---------- 开发环境 AI 模型 ----------
ai:
  model:
    provider: openai
    api-key: ark-9c957d7a-c6d9-4e4a-a396-3817355d4dda-a3b58
    model-name: ep-20260703164026-ncjmt
    base-url: https://ark.cn-beijing.volces.com/api/v3
