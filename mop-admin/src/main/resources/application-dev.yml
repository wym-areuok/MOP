# ===================================================================
# MOP 开发环境配置（第 3 层加载，仅写与 druid.yml 不同的配置）
#
# 加载位置: application.yml → application-druid.yml → 【application-dev.yml】
# 规则: 本文件只写与 application-druid.yml 不同的配置项，相同部分自动继承
#
# 激活方式:
#   IDEA Run/Debug 配置中 Active profiles: dev
#   或命令行: java -jar mop-admin.jar --spring.profiles.active=dev
#   mvn 启动: mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# 说明:
#   1. 默认连接本地 localhost 的 SQL Server + Redis（可被环境变量覆盖）
#   2. 启用 Spring DevTools 热部署（修改代码自动重启）
#   3. 日志级别 debug，便于排查问题
#   4. Swagger 接口文档开启（http://localhost:8080/swagger-ui.html）
#   5. Druid 监控面板开启（账号密码由 application-druid.yml 的环境变量控制）
#   6. 防盗链关闭（便于本地前端联调）
#
# 配置来源说明:
#   本文件中 未写 的 datasource 配置项全部继承自 application-druid.yml:
#     type, driverClassName, initialSize, maxWait, connectTimeout,
#     socketTimeout, validationQuery, filter.stat, filter.wall 等
#   如果需要为开发环境单独设置某个值，直接在本文件添加即可覆盖
#
# 注意事项:
#   - 敏感信息采用 ${ENV:默认值} 格式，开发环境开箱即用
#   - 关于默认值中出现 :（如 JDBC URL）的解析规则请参考 application-druid.yml 顶部注释
#   - 生产环境请使用 application-prod.yml + 生产专用环境变量（无默认值，强制注入）
# ===================================================================

server:
  port: 8080
  tomcat:
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.mop: debug
    org.springframework: warn

# ---------- 开发环境 JWT 密钥（环境变量注入，默认值仅用于本地兼容） ----------
token:
  secret: ${MOP_DEV_TOKEN_SECRET:MOP-2026-Dev-Token-Key-d9kF3pL7sW1xY5zB2aC6dE8fH0jM4nQ}

spring:
  devtools:
    restart:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: ${MOP_DEV_REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  # ---------- 数据库配置 ----------
  # 开发环境与 application-druid.yml 完全一致，无需覆盖任何 datasource 配置

# ---------- 开发环境 Swagger ----------
springdoc:
  swagger-ui:
    enabled: true

# ---------- 开发环境安全策略 ----------
referer:
  enabled: false

xss:
  enabled: true

# ---------- 开发环境 Quartz ----------
quartz:
  jobTimeoutMinutes: 30

# ---------- 开发环境 AI 模型（敏感字段优先走环境变量） ----------
ai:
  model:
    provider: openai
    api-key: ${MOP_DEV_AI_API_KEY:ark-9c957d7a-c6d9-4e4a-a396-3817355d4dda-a3b58}
    model-name: ep-20260703164026-ncjmt
    base-url: https://ark.cn-beijing.volces.com/api/v3
