# ===================================================================
# MOP 开发环境配置（第 2 层加载，自包含完整明文配置）
#
# 加载位置: application.yml → 【application-dev.yml】
#
# 激活方式:
#   IDEA Run/Debug 配置中 Active profiles: dev
#   或命令行: java -jar mop-admin.jar --spring.profiles.active=dev
#   mvn 启动: mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# 说明:
#   1. 连接本地 localhost 的 SQL Server + Redis
#   2. 启用 Spring DevTools 热部署
#   3. 日志级别 debug
#   4. Swagger 接口文档开启（http://localhost:8080/swagger-ui.html）
#   5. Druid 监控面板开启，允许所有 IP 访问
#   6. 防盗链关闭（便于本地前端联调）
#
# 注意事项:
#   - 本文件所有配置均为明文，开发环境开箱即用
#   - 生产环境请使用 application-prod.yml
# ===================================================================

# 文件上传路径（开发环境用相对路径）
mop:
  profile: ./uploadPath

server:
  port: 8080
  tomcat:
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.mop: debug
    org.springframework: warn

# ---------- 开发环境 JWT 密钥 ----------
token:
  secret: MOP-2026-Dev-Token-Key-d9kF3pL7sW1xY5zB2aC6dE8fH0jM4nQ

spring:
  devtools:
    restart:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  # ---------- 数据库配置 ----------
  datasource:
    druid:
      # 主库数据源（开发环境连接本地 SQL Server）
      master:
        url: jdbc:sqlserver://localhost:1433;DatabaseName=mes_ops_platform;TrustServerCertificate=true;sendStringParametersAsUnicode=true
        username: root
        password: root
      # 初始连接数
      initialSize: 10
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # Druid 控制台访问控制
      statViewServlet:
        # 不设白名单，允许所有 IP 访问
        allow:
        login-username: admin
        login-password: 123456
      # SQL 防火墙
      filter:
        wall:
          config:
            multi-statement-allow: true

# ---------- 开发环境 Swagger ----------
springdoc:
  swagger-ui:
    enabled: true

# ---------- 开发环境安全策略 ----------
referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1

xss:
  enabled: true

# ---------- 开发环境 Quartz ----------
quartz:
  jobTimeoutMinutes: 30

# ---------- 开发环境 AI 模型 ----------
ai:
  model:
    provider: openai
    api-key: ark-9c957d7a-c6d9-4e4a-a396-3817355d4dda-a3b58
    model-name: ep-20260703164026-ncjmt
    base-url: https://ark.cn-beijing.volces.com/api/v3
