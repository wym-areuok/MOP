# ===================================================================
# Druid 数据源基准配置（第 2 层加载）
#
# 加载位置: application.yml → 【application-druid.yml】→ application-{dev|prod}.yml
#
# 作用: 存放所有环境通用的 Druid 连接池参数、驱动类、SQL 过滤器配置
#       开发和生产的差异配置（IP、密码、池大小）写在各自的 profile 文件中
#
# ⚠️ 修改原则:
#   本文件定义"所有环境都一样的默认值"
#   dev/prod 仅覆盖需要差异化的配置项（如 url、password、minIdle、maxActive）
#   不要在 dev/prod 中重复本文件已有的相同配置——后者会自动覆盖同名 key
#
# 最终生效值示例（激活 prod 时）:
#   druid.yml 定义:    initialSize=10, maxActive=20, url=localhost
#   prod.yml 覆盖:     maxActive=50, url=127.0.0.1
#   最终生效:           initialSize=10（继承）, maxActive=50（覆盖）, url=127.0.0.1（覆盖）
# ===================================================================
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
    druid:
      # 主库数据源
      master:
        url: jdbc:sqlserver://localhost:1433;DatabaseName=mes_ops_platform;TrustServerCertificate=true;sendStringParametersAsUnicode=true
        username: root
        password: root
      # 从库数据源
      slave:
        # 从数据源开关/默认关闭
        enabled: false
        url:
        username:
        password:
      # 初始连接数
      initialSize: 10
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username: admin
        login-password: 123456
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
          db-type: sqlserver