# ===================================================================
# MOP 生产环境配置（第 2 层加载，自包含完整明文配置）
#
# 加载位置: application.yml → 【application-prod.yml】
#
# 激活方式:
#   java -jar mop-admin.jar --spring.profiles.active=prod
#
# 说明:
#   1. devtools 关闭，禁止热部署
#   2. Swagger 接口文档关闭，防止 API 暴露
#   3. 日志级别 warn，减少磁盘 IO
#   4. Druid 监控仅允许白名单 IP 访问
#   5. 防盗链开启
#   6. 数据库连接池调大（minIdle=20, maxActive=50）
#
# ⚠️ 部署前请将以下占位符替换为真实值:
#   - token.secret            → 生产 JWT 密钥（高强度随机字符串）
#   - datasource.master.*     → 生产数据库连接信息
#   - redis.password          → 生产 Redis 密码（无密码则留空）
#   - statViewServlet.login-password → Druid 控制台强密码
#   - ai.api-key              → 生产 AI API Key
#   - ai.model-name           → 生产 AI 推理接入点
#
# 注意事项:
#   - 本文件所有配置均为明文，请妥善保管
#   - multi-statement-allow=true 在生产评估后决定是否关闭
# ===================================================================

# 文件上传路径（生产环境建议绝对路径）
mop:
  profile: /data/mop/uploadPath

server:
  port: 8080
  tomcat:
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

# 日志: 生产环境 warn 级别（减少磁盘 IO）
logging:
  level:
    com.mop: warn
    org.springframework: warn

# ---------- 生产环境 JWT 密钥 ----------
token:
  secret: <请填写生产环境JWT密钥>

spring:
  devtools:
    restart:
      enabled: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password:
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  # ---------- 数据库配置 ----------
  datasource:
    druid:
      # 主库数据源（生产环境数据库）
      master:
        url: jdbc:sqlserver://<请填写生产数据库IP>:1433;DatabaseName=mes_ops_platform;TrustServerCertificate=true;sendStringParametersAsUnicode=true
        username: <请填写生产数据库账号>
        password: <请填写生产数据库密码>
      # 初始连接数
      initialSize: 10
      # 最小连接池数量（生产环境调大）
      minIdle: 20
      # 最大连接池数量（根据并发量调整）
      maxActive: 50
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # Druid 控制台访问控制
      statViewServlet:
        # 仅允许本机或内网 IP 访问
        allow: 127.0.0.1
        login-username: admin
        login-password: <请填写Druid控制台强密码>
      # SQL 防火墙
      filter:
        wall:
          config:
            multi-statement-allow: true

# ---------- 生产环境 Swagger ----------
springdoc:
  swagger-ui:
    enabled: false

# ---------- 生产环境安全策略 ----------
referer:
  enabled: true
  allowed-domains: localhost,127.0.0.1

xss:
  enabled: true

# ---------- 生产环境 Quartz ----------
quartz:
  jobTimeoutMinutes: 30

# ---------- 生产环境 AI 模型 ----------
ai:
  model:
    provider: openai
    api-key: <请填写生产AI-API-Key>
    model-name: <请填写生产AI推理接入点>
    base-url: https://ark.cn-beijing.volces.com/api/v3
