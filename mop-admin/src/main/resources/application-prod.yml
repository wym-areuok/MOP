# ===================================================================
# MOP 生产环境配置（第 3 层加载，仅写与 druid.yml 不同的配置）
#
# 加载位置: application.yml → application-druid.yml → 【application-prod.yml】
# 规则: 本文件只写与 application-druid.yml 不同的配置项，相同部分自动继承
#
# 激活方式:
#   java -jar mop-admin.jar --spring.profiles.active=prod
#
# ⚠️ 上线前必须检查（搜索 CHANGE_ME，逐项修改）:
#   1. token.secret          → 生成 256 位高强度随机字符串
#   2. 数据库 url/username/password → 改为生产数据库连接信息
#   3. Redis host/password   → 改为生产 Redis 连接信息
#   4. Druid login-password  → 改为非弱密码，limit allow IP 白名单
#   5. referer.allowed-domains → 改为生产域名
#   6. ai.model.api-key/model-name → 改为生产 AI 配置
#
# 说明:
#   1. devtools 关闭，禁止热部署
#   2. Swagger 接口文档关闭，防止 API 暴露
#   3. 日志级别 warn，减少磁盘 IO
#   4. Druid 监控仅允许白名单 IP 访问
#   5. 防盗链开启，仅允许配置的域名访问静态资源
#   6. 数据库连接池调大（minIdle=20, maxActive=50）
#
# 配置来源说明:
#   本文件中 未写 的 datasource 配置项全部继承自 application-druid.yml:
#     type, driverClassName, initialSize, maxWait, connectTimeout,
#     socketTimeout, validationQuery, filter.stat, filter.wall 等
#   当前仅覆盖了以下 5 个与基准不同的配置项:
#     master.url → 127.0.0.1（而非 localhost）
#     minIdle    → 20（而非 10）
#     maxActive  → 50（而非 20）
#     statViewServlet.allow → 127.0.0.1（而非开放所有）
#     statViewServlet.login-password → 强密码（而非 123456）
#
# 注意事项:
#   - 本文件包含生产环境敏感信息，仓库为私有，可放心提交
#   - 上线前务必修改所有 CHANGE_ME 占位项
#   - application-druid.yml 中的 multi-statement-allow=true 在生产评估后决定是否关闭
# ===================================================================

server:
  port: 8080
  tomcat:
    threads:
      max: 800
      min-spare: 100

# 日志: 生产环境 warn 级别（减少磁盘 IO）
logging:
  level:
    com.mop: warn
    org.springframework: warn

# ---------- 生产环境 JWT 密钥（必须改！！高强度随机字符串）----------
token:
  secret: CHANGE_ME_PleaseGenerate256bitRandomStringForProductionEnvironment

# Spring 配置
spring:
  # 生产环境关闭 devtools
  devtools:
    restart:
      enabled: false
  data:
    redis:
      host: 127.0.0.1         # ← 改为生产 Redis IP
      port: 6379
      database: 0
      password:               # ← 设置生产 Redis 密码
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  # ---------- 生产环境数据库（仅列出与 application-druid.yml 的差异项）----------
  datasource:
    druid:
      master:
        url: jdbc:sqlserver://127.0.0.1:1433;DatabaseName=mes_ops_platform;TrustServerCertificate=true;sendStringParametersAsUnicode=true  # ← 改为生产数据库 IP
        username: root         # ← 改为生产数据库账号
        password: root         # ← 改为生产数据库密码
      minIdle: 20              # 生产环境调大
      maxActive: 50            # 生产环境调大（根据并发量）
      statViewServlet:
        allow: 127.0.0.1      # ← 仅允许内网/本机访问
        login-password: CHANGE_ME_StrongDruidPassword   # ← 必须改为强密码

# ---------- 生产环境关闭 Swagger ----------
springdoc:
  swagger-ui:
    enabled: false

# ---------- 生产环境安全策略 ----------
referer:
  enabled: true
  allowed-domains: localhost,127.0.0.1  # ← 改为生产域名，如 your-domain.com

xss:
  enabled: true

# ---------- 生产环境 AI 模型 ----------
ai:
  model:
    provider: openai
    api-key: CHANGE_ME_ProdAIKey          # ← 改为生产 API Key
    model-name: ep-CHANGE-ME              # ← 改为生产推理接入点
    base-url: https://ark.cn-beijing.volces.com/api/v3
