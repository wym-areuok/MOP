# ===================================================================
# MOP 生产环境配置（第 2 层加载，自包含完整明文配置）
#
# 加载位置: application.yml → 【application-prod.yml】
#
# 激活方式:
#   java -jar mop-admin.jar --spring.profiles.active=prod
#
# 说明:
#   1. devtools 关闭，禁止热部署
#   2. Swagger 接口文档关闭，防止 API 暴露
#   3. 日志级别 warn，减少磁盘 IO
#   4. Druid 监控仅允许白名单 IP 访问
#   5. 防盗链开启
#   6. 数据库连接池调大（minIdle=20, maxActive=50）
#
# ⚠️ 部署前请将以下占位符替换为真实值:
#   - token.secret            → 生产 JWT 密钥（高强度随机字符串）
#   - datasource.*.url/username/password → 所有数据源（master + server_a~e）的连接信息
#   - redis.password          → 生产 Redis 密码（无密码则留空）
#   - statViewServlet.login-password → Druid 控制台强密码
#   - ai.api-key              → 生产 AI API Key
#   - ai.model-name           → 生产 AI 推理接入点
#
# 注意事项:
#   - 本文件所有配置均为明文，请妥善保管
#   - multi-statement-allow=true 在生产评估后决定是否关闭
# ===================================================================

# 文件上传路径（生产环境建议绝对路径）
mop:
  profile: /data/mop/uploadPath

server:
  port: 8080
  tomcat:
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

# 日志: 生产环境 warn 级别（减少磁盘 IO）
logging:
  level:
    com.mop: warn
    org.springframework: warn

# ---------- 生产环境 JWT 密钥 ----------
token:
  secret: <请填写生产环境JWT密钥>

spring:
  devtools:
    restart:
      enabled: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password:
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  # ---------- 数据库配置 ----------
  datasource:
    dynamic:
      # Druid 连接池大小（生产环境）
      druid:
        initialSize: 10
        minIdle: 20
        maxActive: 50
      datasource:
        master:
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
          type: com.alibaba.druid.pool.DruidDataSource
          url: jdbc:sqlserver://<请填写生产数据库IP>:1433;DatabaseName=mes_ops_platform;TrustServerCertificate=true;sendStringParametersAsUnicode=true
          username: <请填写生产数据库账号>
          password: <请填写生产数据库密码>
        server_a:
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
          type: com.alibaba.druid.pool.DruidDataSource
          url: jdbc:sqlserver://<请填写A服务器IP>:1433;DatabaseName=<请填写入口库名>;TrustServerCertificate=true;sendStringParametersAsUnicode=true
          username: <请填写A服务器账号>
          password: <请填写A服务器密码>
        server_b:
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
          type: com.alibaba.druid.pool.DruidDataSource
          url: jdbc:sqlserver://<请填写B服务器IP>:1433;DatabaseName=<请填写入口库名>;TrustServerCertificate=true;sendStringParametersAsUnicode=true
          username: <请填写B服务器账号>
          password: <请填写B服务器密码>
        server_c:
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
          type: com.alibaba.druid.pool.DruidDataSource
          url: jdbc:sqlserver://<请填写C服务器IP>:1433;DatabaseName=<请填写入口库名>;TrustServerCertificate=true;sendStringParametersAsUnicode=true
          username: <请填写C服务器账号>
          password: <请填写C服务器密码>
        server_d:
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
          type: com.alibaba.druid.pool.DruidDataSource
          url: jdbc:sqlserver://<请填写D服务器IP>:1433;DatabaseName=<请填写入口库名>;TrustServerCertificate=true;sendStringParametersAsUnicode=true
          username: <请填写D服务器账号>
          password: <请填写D服务器密码>
        server_e:
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
          type: com.alibaba.druid.pool.DruidDataSource
          url: jdbc:sqlserver://<请填写E服务器IP>:1433;DatabaseName=<请填写入口库名>;TrustServerCertificate=true;sendStringParametersAsUnicode=true
          username: <请填写E服务器账号>
          password: <请填写E服务器密码>

    # Druid 控制台访问控制
    druid:
      statViewServlet:
        # 仅允许本机或内网 IP 访问
        allow: 127.0.0.1
        login-username: admin
        login-password: <请填写Druid控制台强密码>
      filter:
        wall:
          config:
            multi-statement-allow: true

# ---------- 生产环境 Swagger ----------
springdoc:
  swagger-ui:
    enabled: false

# ---------- 生产环境安全策略 ----------
referer:
  enabled: true
  allowed-domains: localhost,127.0.0.1

xss:
  enabled: true

# ---------- 生产环境 Quartz ----------
quartz:
  jobTimeoutMinutes: 30

# ---------- 生产环境 AI 模型 ----------
ai:
  model:
    provider: openai
    api-key: <请填写生产AI-API-Key>
    model-name: <请填写生产AI推理接入点>
    base-url: https://ark.cn-beijing.volces.com/api/v3
